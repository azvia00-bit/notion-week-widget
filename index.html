<div id="week-widget"></div>

<script>
const START_DATE = new Date("2026-09-28T00:00:00");

function getWeekInfo() {
  const today = new Date();

  // Remove time so we're comparing dates only
  const current = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate()
  );

  const start = new Date(
    START_DATE.getFullYear(),
    START_DATE.getMonth(),
    START_DATE.getDate()
  );

  const daysSinceStart = Math.floor(
    (current - start) / (1000 * 60 * 60 * 24)
  );

  // Week 1 starts on 28 September 2026
  const weekNumber = Math.floor(daysSinceStart / 7) + 1;

  const monday = new Date(start);
  monday.setDate(start.getDate() + (weekNumber - 1) * 7);

  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  return {
    weekNumber,
    monday,
    sunday
  };
}

function formatDate(date) {
  return date.toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function updateWidget() {
  const { weekNumber, monday, sunday } = getWeekInfo();

  document.getElementById("week-widget").innerHTML = `
    <div style="
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 24px;
      border-radius: 16px;
      background: #f7f7f5;
      color: #37352f;
    ">
      <div style="
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
      ">
        Week ${weekNumber}
      </div>

      <div style="
        font-size: 16px;
        color: #787774;
      ">
        ${formatDate(monday)} – ${formatDate(sunday)}
      </div>
    </div>
  `;
}

updateWidget();

// Check every minute for a new week
setInterval(updateWidget, 60000);
</script>
